{% extends 'base.html' %}{% block title %}Donor profile | LifeLine{% endblock %}{% block content %}
<div class="page-heading"><span class="eyebrow">DONOR PROFILE</span><h1 class="section-title">{{ 'Update' if donor else 'Become a' }} blood donor</h1><p class="text-secondary">Enter accurate details so nearby people can find you when needed.</p></div>
<img src="{{ url_for('static', filename='images/blood-donor-center.jpg') }}" alt="A donor seated at a blood drive while a medical worker assists" class="img-fluid rounded-3 mb-4" loading="lazy" decoding="async">
<div class="form-panel"><form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Age</label><input class="form-control" type="number" name="age" min="18" max="65" required value="{{ donor.age if donor else '' }}"></div>
<div class="col-md-6"><label class="form-label">Blood group</label><select class="form-select" name="blood_group" required><option value="">Choose blood group</option>{% for g in blood_groups %}<option {{ 'selected' if donor and donor.blood_group==g else '' }}>{{ g }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Gender (optional)</label><select class="form-select" name="gender"><option>Prefer not to say</option><option {{ 'selected' if donor and donor.gender=='Female' else '' }}>Female</option><option {{ 'selected' if donor and donor.gender=='Male' else '' }}>Male</option><option {{ 'selected' if donor and donor.gender=='Other' else '' }}>Other</option></select></div>
<div class="col-md-6"><label class="form-label">City</label><input class="form-control" name="city" required value="{{ donor.city if donor else '' }}" placeholder="Your city"></div>
<div class="col-12"><label class="form-label">Address / Area (optional)</label><input class="form-control" name="address" value="{{ donor.address if donor else '' }}" placeholder="Locality"></div>
<div class="col-md-6"><label class="form-label">Last donation date (if any)</label><input class="form-control" type="date" name="last_donation_date" max="{{ current_year }}-12-31" value="{{ donor.last_donation_date if donor and donor.last_donation_date else '' }}"></div>
<div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="available" id="available" {{ 'checked' if not donor or donor.available else '' }}><label class="form-check-label" for="available">I am currently available to be contacted as a donor</label></div></div>
<div class="col-12"><button class="btn btn-danger btn-lg">Save Donor Profile</button></div></form></div>{% endblock %}
